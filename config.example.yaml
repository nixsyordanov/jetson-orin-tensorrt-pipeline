# ==============================================================================
# Jetson Orin TensorRT High-Throughput Vision Pipeline Configuration
# ==============================================================================

device:
  power_mode: "MAXN"          # Recommended: MAXN for full clock speeds
  jetson_clocks: true         # Lock clocks to maximum frequencies
  cuda_device: 0

camera:
  # Source type: "rtsp", "v4l2", "video_file", or "synthetic"
  source_type: "synthetic"
  # RTSP URL (use environment variables or sanitized templates)
  # rtsp_url: "rtsp://username:password@192.168.1.100:554/stream"
  rtsp_url: ""
  v4l2_device_id: 0
  video_file_path: ""
  resolution: [1920, 1080]    # [Width, Height]
  target_fps: 30
  capture_backend: "auto"     # "gstreamer" (hardware NVDEC), "ffmpeg", or "auto"

inference:
  # Path to compiled native TensorRT engine (.engine) or PyTorch (.pt) weights
  engine_path: "models/yolo11s_1024_fp16.engine"
  input_shape: [1, 3, 1024, 1024] # [B, C, H, W]
  precision: "fp16"           # "fp16" or "fp32"
  confidence_threshold: 0.25
  iou_threshold: 0.45
  classes:
    0: "target"

streamer:
  enabled: false
  # Protocols supported: "srt", "rtsp", "udp"
  output_url: "srt://127.0.0.1:8890?streamid=publish:live_stream"
  resolution: [1920, 1080]
  fps: 25
  bitrate: "2500k"
  maxrate: "3200k"
  bufsize: "1600k"
  preset: "ultrafast"

osd:
  enabled: true
  draw_fps: true
  draw_telemetry: true
  draw_bounding_boxes: true
  box_thickness: 2
  font_scale: 0.55
  color_scheme: "tactical_cyan" # "tactical_cyan", "emerald", or "amber"

metrics:
  enable_tegrastats: true
  log_interval_sec: 1.0
